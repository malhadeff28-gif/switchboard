name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Standard hosted runners are free for public repositories. Avoid starting
    # these jobs automatically if this repository is later made private.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  claude-cli-local:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned Claude CLI in temporary directory
        run: npm install --prefix "$RUNNER_TEMP/switchboard-claude" --no-save --no-audit --no-fund @anthropic-ai/claude-code@2.1.318
      - name: Check CLI against local mock
        run: npm run test:claude-local
        env:
          SWITCHBOARD_CLAUDE_BIN: ${{ runner.temp }}/switchboard-claude/node_modules/.bin/claude
