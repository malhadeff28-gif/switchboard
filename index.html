<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dce8fb">
  <meta name="description" content="Download Switchboard for Apple silicon Macs.">
  <title>Switchboard</title>
  <style>
    :root {
      color-scheme: light;
      background: #dce8fb;
      color: #444b56;
      font-family: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1.75rem;
      padding: 1.5rem 1rem 2.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 11vw, 5.5rem);
      font-weight: 720;
      line-height: 1.04;
      letter-spacing: -.052em;
    }
    .download {
      display: grid;
      place-items: center;
      width: min(16rem, 81vw);
      min-height: 5.2rem;
      padding: .7rem 1rem;
      border: 2px solid #a3202c;
      border-radius: .78rem;
      background: #c52d37;
      color: #fff;
      box-shadow: 0 13px #811823, 0 16px 0 #182c4826;
      font-size: clamp(1.25rem, 4.5vw, 1.65rem);
      font-weight: 750;
      text-decoration: none;
      touch-action: manipulation;
      user-select: none;
      transition: transform 110ms ease-out, box-shadow 110ms ease-out, background-color 110ms ease-out;
    }
    .download:hover { background: #af2430; }
    .open-app { color: #244b84; text-underline-offset: 4px; }
    .download:focus-visible { outline: 3px solid #2254aa; outline-offset: 7px; }
    .download:active, .download.pressed {
      transform: translateY(12px);
      background: #ae242f;
      box-shadow: 0 1px #811823, 0 4px 0 #182c4826;
    }
    @media (prefers-reduced-motion: reduce) { .download { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Switchboard</h1>
    <a class="download" href="https://github.com/malhadeff28-gif/switchboard/releases/download/v0.3.1-pilot.3/Switchboard-0.3.1-pilot.3-notarized-arm64.zip" aria-label="Download Switchboard for Apple silicon Mac">Download</a>
    <a class="open-app" href="https://switchboard.us.com/app/">Open Switchboard</a>
  </main>
  <script>
    const download = document.querySelector('.download');
    download.addEventListener('click', (event) => {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
      event.preventDefault();
      if (download.classList.contains('pressed')) return;
      download.classList.add('pressed');
      window.setTimeout(() => {
        download.classList.remove('pressed');
        window.location.assign(download.href);
      }, 200);
    });
  </script>
</body>
</html>
